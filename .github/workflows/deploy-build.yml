# Builds all three sites on every push to main and commits the result to the `deploy` branch.
# cPanel → Git Version Control pulls that branch and runs deploy.sh (tools/deploy/), which copies
# each site into its live folder. The server needs no Node; nothing here touches the server directly.
name: Build for cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the three sites
        env:
          # Public Turnstile site key (Settings → Secrets and variables → Actions → Variables). Empty = no widget.
          TURNSTILE_SITE: ${{ vars.TURNSTILE_SITE }}
        run: |
          npm run build
          npm run build:marketing
          npm run package:crm

      - name: Put the builds together
        run: |
          rm -rf out && mkdir out
          cp -a dist out/stusyn
          cp -a dist-marketing out/marketing
          cp -a dist-crm out/crm
          # Never ship server data or settings, even if something slipped into a build.
          find out -name 'config.php' -path '*/app/*' -delete
          find out \( -name '*.sqlite*' -o -name '*.key' -o -name '*.zip' \) -delete
          cp tools/deploy/cpanel.yml out/.cpanel.yml
          cp tools/deploy/deploy.sh out/deploy.sh
          cp tools/deploy/README.md out/README.md
          printf 'Built from %s (%s)\n%s\n' "${GITHUB_SHA::7}" "$(date -u +'%Y-%m-%d %H:%M UTC')" "$(git log -1 --pretty=%s)" > out/BUILD.txt

      - name: Commit to the deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin deploy >/dev/null; then
            git fetch --depth 1 origin deploy
            git worktree add d FETCH_HEAD
          else
            git worktree add --detach d
            (cd d && git checkout -q --orphan deploy && git rm -rfq .)
          fi
          cd d
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../out/. .
          git add -A
          if git diff --cached --quiet; then echo "No changes to deploy."; exit 0; fi
          git commit -q -m "Build ${GITHUB_SHA::7}: $(git -C .. log -1 --pretty=%s)"
          git push origin HEAD:refs/heads/deploy
