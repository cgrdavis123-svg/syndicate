# On every push to main: build all three sites and upload them to the cPanel server over FTPS.
# The upload (tools/deploy/ftp-deploy.sh) adds and replaces files only. It never deletes anything on the
# server and never uploads app/config.php or storage/ data. Until the FTP secrets are set it only builds.
# Run it by hand from the Actions tab (Run workflow); tick "check only" to see where files would go.
name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check:
        description: Check only (find the folders, upload nothing)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      STUSYN_DIR: ${{ vars.STUSYN_DIR }}
      MARKETING_DIR: ${{ vars.MARKETING_DIR }}
      CRM_DIR: ${{ vars.CRM_DIR }}
      FTP_VERIFY_CERT: ${{ vars.FTP_VERIFY_CERT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the three sites
        env:
          # Public Turnstile site key (repo variable). Empty = no widget, which matches what's live now.
          TURNSTILE_SITE: ${{ vars.TURNSTILE_SITE }}
        run: |
          npm run build
          npm run build:marketing
          npm run package:crm
          rm -rf out && mkdir out
          cp -a dist out/stusyn && cp -a dist-marketing out/marketing && cp -a dist-crm out/crm
          find out -name 'config.php' -path '*/app/*' -delete
          find out \( -name '*.sqlite*' -o -name '*.key' -o -name '*.zip' \) -delete

      - name: Upload to the server
        if: env.FTP_SERVER != ''
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          bash tools/deploy/ftp-deploy.sh out ${{ inputs.check && '--check' || '' }}

      - name: No FTP details yet
        if: env.FTP_SERVER == ''
        run: echo "Built, but not uploaded. Add the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to deploy."
